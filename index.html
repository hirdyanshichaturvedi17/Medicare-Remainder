<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Reminder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main">

    <header>
        <h1>💊 MediCare Reminder</h1>
        <p>Manage your medicines and daily health schedule</p>
    </header>

    <div class="container">

        <form id="medicineForm">

            <h2>Add Medicine</h2>

            <div class="row">

                <div class="sec">
                    <label for="medicineName">Medicine Name</label>
                    <input type="text" id="medicineName"
                           placeholder="e.g. Paracetamol">
                    <small id="medicineError"></small>
                </div>

                <div class="sec">
                    <label for="dosage">Dosage</label>
                    <input type="text" id="dosage"
                           placeholder="e.g. 500 mg">
                </div>

            </div>

            <div class="row">

                <div class="sec">
                    <label for="time">Medicine Time</label>
                    <input type="time" id="time">
                    <small id="timeError"></small>
                </div>

                <div class="sec">
                    <label for="frequency">Frequency</label>

                    <select id="frequency">
                        <option value="">Select frequency</option>
                        <option value="Once a day">Once a day</option>
                        <option value="Twice a day">Twice a day</option>
                        <option value="Three times a day">Three times a day</option>
                        <option value="As needed">As needed</option>
                    </select>
                </div>

            </div>

            <div class="sec">
                <label for="notes">Notes</label>
                <textarea id="notes"
                    placeholder="e.g. Take after food"></textarea>
            </div>

            <button type="submit" class="addBtn">
                + Add Medicine
            </button>

        </form>


        <section class="dashboard">

            <div class="dashboardTop">
                <div>
                    <h2>Today's Medicines</h2>
                    <p>Keep track of your daily medication schedule.</p>
                </div>

                <div class="dateBox" id="today"></div>
            </div>

            <div id="medicineList" class="medicineList">

                <div class="empty">
                    <div>💊</div>
                    <h3>No medicines added</h3>
                    <p>Add your first medicine above.</p>
                </div>

            </div>

        </section>

    </div>

    <footer>
        <p>© 2026 MediCare Reminder | Stay Healthy, Stay Safe ❤️</p>
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
